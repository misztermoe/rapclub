<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; /* Verhindert hässliche weiße Ränder in Canva */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .player-container {
            background: #ffffff; /* Hintergrundfarbe des Players */
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        audio {
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Ersetzen Sie 'musik.mp3' mit dem exakten Namen Ihrer hochgeladenen Datei -->
        <audio controls src="musik.mp3"></audio>
    </div>

</body>
</html>
